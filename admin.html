<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173765">
<title>إدارة الفيديوهات | فرست كير رأس الخيمة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172235;font-family:Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{width:min(920px,calc(100% - 28px));margin:28px auto}
header{background:#173765;color:#fff;padding:22px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:25px;margin:0}header p{margin:4px 0 0;color:#dce6f5;font-size:13px}
a{color:inherit;text-decoration:none}.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.white{background:#fff;color:#173765}.blue{background:#173765;color:#fff}.green{background:#e7f6ed;color:#087b50}.red{background:#fff0ef;color:#b42318}.gray{background:#eef2f7;color:#344054}
.panel{background:#fff;border:1px solid #e4e9f1;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 4px 18px #15294b08}
h2{font-size:20px;color:#173765;margin:0 0 12px}.hint{font-size:13px;color:#667085;margin:0 0 16px}
form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:14px;font-weight:700}
input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:9px;padding:11px;font:inherit;background:#fff;min-width:0}input:focus,select:focus{outline:2px solid #b9c9e3;border-color:#244c83}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eef0f4}.item:last-child{border:0}.item strong{display:block;color:#173765}.item small{color:#667085;overflow-wrap:anywhere}.empty{color:#667085;text-align:center;padding:18px}
.notice{background:#fff8e6;border:1px solid #f4d58b;color:#7a4b00;border-radius:12px;padding:13px;font-size:13px}
@media(max-width:600px){form{grid-template-columns:1fr}.field.full{grid-column:auto}.item{align-items:flex-start}.item .btn{padding:8px;font-size:12px}}
</style></head>
<body>
<header><div class="wrap head" style="margin-top:0;margin-bottom:0"><div><h1>إدارة فيديوهات فرست كير</h1><p>رفع الفيديوهات ونشرها للزوار</p></div><a class="btn white" href="index.html">العودة للموقع</a></div></header>
<main class="wrap">
 <section class="panel">
  <h2>إضافة فيديو جديد</h2>
  <p class="hint">اختر فيديو من جهازك. الحد الأقصى ٥٠ ميجابايت. صيغة MP4 أنسب للمشاهدة على أجهزة مختلفة.</p>
  <form id="videoForm">
   <div class="field"><label for="title">اسم الفيديو *</label><input id="title" maxlength="120" required placeholder="مثال: عاملة منزلية 01"></div>
   <div class="field"><label for="nationality">الجنسية *</label><select id="nationality" required><option value="">اختر الجنسية</option><option>الفلبين</option><option>إندونيسيا</option><option>سيرلانكا</option><option>الهند</option><option>ميانمار</option><option>كينيا</option><option>تنزانيا</option><option>مدغشقر</option></select></div>
   <div class="field"><label for="file">اختار فيديو من الجهاز</label><input type="file" id="file" required accept=".mp4,.m4v,.mov,.webm,video/mp4,video/quicktime,video/webm"></div>
   <div class="field"><label for="email">بريد مدير الفيديوهات</label><input type="email" id="email" autocomplete="username" required></div><div class="field"><label for="password">كلمة مرور الإدارة</label><input type="password" id="password" autocomplete="current-password" required></div>
   <div class="field full"><label for="description">وصف مختصر (اختياري)</label><input id="description" maxlength="1500" placeholder="معلومات إضافية عن الفيديو"></div>
  </form>
  <button class="btn blue" form="videoForm" id="publish">رفع ونشر الفيديو</button>
  <p role="status" id="status"></p>
 </section><section class="panel"><h2>الفيديوهات المرفوعة من الجهاز</h2><div id="list"></div></section></main>
<script src="firstcare-cloud.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
const client=window.supabase.createClient(firstcareUrl,firstcarePublicKey,{auth:{persistSession:false,detectSessionInUrl:false}});
async function authenticate(){
 const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error)throw Error('تعذر تسجيل الدخول. راجع البريد وكلمة المرور.');
 if(data.user.app_metadata.firstcare_admin!==true)throw Error('هذا الحساب لا يملك صلاحية إدارة الفيديوهات.');
}
async function refresh(){
 const items=await publishedVideos();
 $('list').replaceChildren();
 if(!items.length)$('list').textContent='لم تُرفع فيديوهات بعد.';
 for(const item of items){
  const row=document.createElement('div'),label=document.createElement('strong'),button=document.createElement('button');
  row.className='item';label.textContent=item.title+' · '+item.nationality;button.className='btn red';button.textContent='حذف';
  button.onclick=async()=>{
   if(!$('email').reportValidity()||!$('password').reportValidity()||!confirm('حذف هذا الفيديو المنشور؟'))return;
   button.disabled=true;
   try{
    await authenticate();
    const {error}=await client.storage.from(bucketName).remove([item.path]);
    if(error)throw Error('تعذر حذف الفيديو.');
    await refresh();$('status').textContent='تم حذف الفيديو.';
   }catch(e){$('status').textContent=e.message}finally{button.disabled=false}
  };
  row.append(label,button);$('list').append(row);
 }
}
$('videoForm').onsubmit=async event=>{
 event.preventDefault();
 const file=$('file').files[0];
 const extension=file.name.split('.').pop().toLowerCase();
 const mime={mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm'}[extension];
 if(!mime||!file.size||file.size>50000000){$('status').textContent='اختر فيديو MP4 أو MOV أو WebM بحجم أقصاه ٥٠ ميجابايت.';return}
 $('publish').disabled=true;$('status').textContent='جارٍ التحقق من الحساب ورفع الفيديو…';
 try{
  await authenticate();
  const metadata={title:$('title').value.trim(),nationality:$('nationality').value,description:$('description').value.trim()};
  if(!metadata.title)throw Error('اكتب اسم الفيديو.');
  const path=crypto.randomUUID()+'.'+extension;
  const {error}=await client.storage.from(bucketName).upload(path,file,{metadata,contentType:mime,upsert:false});
  if(error)throw Error('تعذر رفع الفيديو. راجع الاتصال ومساحة التخزين وصلاحيات الحساب.');
  $('file').value='';$('title').value='';$('description').value='';$('status').textContent='تم نشر الفيديو.';
  await refresh().catch(()=>{});
 }catch(e){$('status').textContent=e.message}finally{$('publish').disabled=false}
};
refresh().catch(()=>{$('list').textContent='تعذر تحميل القائمة. تأكد من إعداد التخزين.'});
</script></body></html>
